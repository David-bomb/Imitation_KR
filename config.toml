# Интервал таймера; число GPU может быть не кратно восьми.
tick_ms = 1000
gpu_count = 256
# Добавка к исходному времени за каждую ноду сверх первой; 0 отключает штраф.
node_penalty = 0.5

[generator]
enabled = false
probability = 0.35
time_min = 1
time_max = 20
gpu_min = 1
# Если gpu_max не указан, используется min(32, gpu_count).
# gpu_max = 32
# seed = 42
